name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  actions: read

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: login_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, mysqli, openssl, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Import schema into test DB
        run: mysql -h 127.0.0.1 -u root login_test < database/schema_test.sql

      - name: Start Valkey
        run: |
          docker run -d --name valkey -p 127.0.0.1:6379:6379 valkey/valkey:9.2 valkey-server --requirepass ci-secret
          for i in $(seq 1 20); do
            docker exec valkey valkey-cli -a ci-secret --no-auth-warning ping && exit 0
            sleep 1
          done
          echo "Valkey no respondió" && exit 1

      - name: Create .env.testing
        run: |
          cp .env.testing.example .env.testing
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-secret/' .env.testing
          grep -E '^[A-Z_]+=' .env.testing > .env

      - name: Run PHPUnit
        env:
          REDIS_REQUIRED: "true"
        run: vendor/bin/phpunit --colors=always

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, mysqli, openssl, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create .env
        run: grep -E '^[A-Z_]+=' .env.testing.example > .env

      - name: PHPStan
        run: composer stan

      - name: Pint
        run: composer lint
